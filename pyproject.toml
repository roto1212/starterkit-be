[project]
name = "starterkit-be"
version = "0.1.0"
description = "FastAPI 백엔드 스타터킷"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aioodbc>=0.5.0",
    "alembic>=1.18.0",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.135.3",
    "greenlet>=3.4.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "orjson>=3.11.8",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.13.0",
    "pyodbc>=5.3.0",
    "python-multipart>=0.0.26",
    "rich>=14.0.0",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.10",
]

[tool.uv]
python-preference = "managed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
# integration/api 테스트는 MSSQL이 없으면 conftest.py가 자동으로 skip 처리한다.
# unit만 빠르게 돌리려면: uv run pytest tests/unit

[tool.mypy]
ignore_missing_imports = true
python_version = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "S"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI의 Depends()/Query() 등은 함수 호출을 기본값으로 쓰는 게 의도된 패턴이다
# (매 요청마다 재평가됨). B008이 이를 "가변 기본값" 버그로 오탐하므로 예외 처리.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.ruff.lint.per-file-ignores]
# assert 허용, 테스트 함수 반환/인자 힌트 생략 허용, 테스트용 문자열을 하드코딩
# 시크릿으로 오탐하는 S105/S106 제외
"tests/**/*.py" = ["S101", "S105", "S106", "ANN201", "ANN001"]
# alembic 콜백 시그니처(include_object 등)는 alembic 자체가 Any로 선언해서 강제한다
"alembic/env.py" = ["ANN401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
